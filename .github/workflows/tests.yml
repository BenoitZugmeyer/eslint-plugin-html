name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Every sunday at midnight
    - cron: "0 0 * * 0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: node tools/toc.js check
      - run: npx markdown-link-check -p README.md --config ./markdown-link-check.config.json

  integration:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
        eslint: ["9.0", latest, next]
        include:
          # Windows support
          - os: windows-latest
            eslint: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - run: npm ci
      - run: bash tools/integration-tests.bash ${{ matrix.eslint }}

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        eslint: [latest]
        include:
          # Lowest ESLint version supported
          - os: ubuntu-latest
            node: 26
            eslint: "9.0"

          # Upcoming ESLint major version support
          - os: ubuntu-latest
            node: 26
            eslint: next

          # Windows support
          - os: windows-latest
            node: 26
            eslint: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install eslint@${{ matrix.eslint }}
      - run: npm test
