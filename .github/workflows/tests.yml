name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Every sunday at midnight
    - cron: "0 0 * * 0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: node tools/toc.ts check
      - run: npx markdown-link-check -p README.md --config ./markdown-link-check.config.json

  integration:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]
        eslint: ["9.0", latest, next]
        include:
          # Node.js 20 support: the build and the tests need Node.js 22.18+, so only the built
          # package runs there
          - os: ubuntu-latest
            node: 20
            eslint: latest

          # Windows support
          - os: windows-latest
            node: 24
            eslint: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the package
        shell: bash
        run: echo "PACKAGE_PATH=$(realpath "$(npm pack --silent | tail -n 1)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bash tools/integration-tests.bash ${{ matrix.eslint }}

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Tests run from the TypeScript sources, with the type stripping of Node.js 22.18+
        node: [22, 24]
        eslint: [latest]
        include:
          # ESLint 9 support: lowest major version supported
          - os: ubuntu-latest
            node: 24
            eslint: "9"

          # Upcoming ESLint major version support
          - os: ubuntu-latest
            node: 24
            eslint: next

          # Windows support
          - os: windows-latest
            node: 24
            eslint: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install eslint@${{ matrix.eslint }}
      - run: npm test
